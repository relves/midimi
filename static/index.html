<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>midimi — music theory tutor</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@starfederation/datastar@1.0.0-beta.11/dist/datastar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #14141c;
      --border: #2a2a38;
      --accent: #7c6af7;
      --accent-dim: #4a3fa3;
      --text: #e8e6f0;
      --text-dim: #888;
      --user-bg: #1e2a3a;
      --asst-bg: #1a1a22;
      --pill-bg: #252535;
      --sidebar-w: 240px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.05em; }
    header span { color: var(--accent); }
    .tagline { color: var(--text-dim); font-size: 0.8rem; margin-left: auto; }

    #toggle-sidebar {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 0.85rem;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #toggle-sidebar:hover { border-color: var(--accent); color: var(--text); }

    #layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #sidebar {
      width: var(--sidebar-w);
      background: var(--surface2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s ease, opacity 0.2s ease;
      overflow: hidden;
    }
    #sidebar.collapsed {
      width: 0;
      opacity: 0;
      border-right: none;
    }

    #sidebar-inner {
      width: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    #new-chat-btn {
      margin: 12px;
      padding: 8px 12px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #new-chat-btn:hover { background: #9b8dff; }

    #sessions-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .session-item {
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.12s, color 0.12s;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .session-item:hover { background: var(--surface); color: var(--text); }
    .session-item.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--accent-dim);
    }
    .session-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-delete {
      flex-shrink: 0;
      background: none;
      border: none;
      color: transparent;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0 2px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.12s, background 0.12s;
    }
    .session-item:hover .session-delete { color: var(--text-dim); }
    .session-delete:hover { color: #e07070 !important; background: rgba(224,112,112,0.12); }
    .session-star {
      flex-shrink: 0;
      background: none;
      border: none;
      color: transparent;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0 2px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.12s, background 0.12s;
    }
    .session-item:hover .session-star { color: var(--text-dim); }
    .session-star.starred { color: #f0c040 !important; }
    .session-star:hover { color: #f0c040 !important; background: rgba(240,192,64,0.12); }
    .sessions-section-header {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 10px 10px 4px;
      opacity: 0.6;
    }

    #sessions-empty {
      color: var(--text-dim);
      font-size: 0.8rem;
      text-align: center;
      padding: 20px 12px;
    }

    /* ── Daily Scale Patch ── */
    #drill-entry {
      margin: 0 12px 8px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--accent-dim);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
      transition: background 0.12s, border-color 0.12s;
    }
    #drill-entry:hover { background: var(--surface2); border-color: var(--accent); }
    #drill-entry.active { border-color: var(--accent); background: var(--surface2); }
    #drill-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      white-space: nowrap;
    }
    #drill-badge.done { background: transparent; color: #f0a040; }

    #drill-panel {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-y: auto;
    }
    #drill-panel.open { display: flex; }
    .drill-card {
      width: 100%;
      max-width: 520px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      text-align: center;
    }
    .drill-prompt { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .drill-sub { color: var(--text-dim); font-size: 0.82rem; margin-bottom: 20px; }
    #drill-answer {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--accent-dim);
      border-radius: 8px;
      color: var(--text);
      box-sizing: border-box;
    }
    #drill-answer:focus { outline: none; border-color: var(--accent); }
    .drill-btn {
      margin-top: 16px;
      padding: 10px 20px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .drill-btn:hover { background: #9b8dff; }
    .drill-btn.secondary { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .drill-result { margin-top: 22px; }
    .drill-notes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
    .drill-note {
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid var(--border);
    }
    .drill-note.ok { background: rgba(80,200,120,0.15); border-color: #50c878; color: #7fe0a0; }
    .drill-note.bad { background: rgba(224,112,112,0.15); border-color: #e07070; color: #f0a0a0; }
    .drill-verdict { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
    .drill-verdict.correct { color: #7fe0a0; }
    .drill-verdict.incorrect { color: #f0a0a0; }
    .drill-done { text-align: center; }
    .drill-done .big { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
    #drill-close {
      align-self: flex-start;
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 0.85rem; margin-bottom: 12px;
    }
    #drill-close:hover { color: var(--text); }

    /* Circle-of-fifths mastery grid */
    #drill-grid-wrap { width: 100%; max-width: 520px; margin-bottom: 18px; text-align: center; }
    #drill-grid-wrap .grid-title { color: var(--text-dim); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    #drill-grid { display: block; margin: 0 auto; }
    #drill-grid .cof-node { cursor: default; transition: opacity 0.12s; }
    #drill-grid .cof-label { font: 600 11px system-ui, sans-serif; fill: var(--text); pointer-events: none; }
    #drill-grid .cof-ear { font: 700 8px system-ui, sans-serif; fill: var(--accent); pointer-events: none; }

    /* Play-it mode */
    .drill-mode-toggle { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
    .drill-mode-toggle button {
      padding: 6px 14px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
      border-radius: 16px;
    }
    .drill-mode-toggle button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .drill-mode-toggle button:disabled { opacity: 0.4; cursor: not-allowed; }
    .drill-hint { color: var(--text-dim); font-size: 0.74rem; margin-top: 6px; }
    .drill-recording { color: #f0a0a0; font-weight: 700; }

    /* Ear-mode choice buttons */
    .drill-choices { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 18px 0; }
    .drill-choice {
      min-width: 64px; padding: 14px 18px; font-size: 1.05rem; font-weight: 700; cursor: pointer;
      background: var(--surface); border: 1px solid var(--accent-dim); border-radius: 10px; color: var(--text);
    }
    .drill-choice:hover { border-color: var(--accent); background: var(--surface2); }
    .drill-choice.right { background: rgba(80,200,120,0.18); border-color: #50c878; color: #7fe0a0; }
    .drill-choice.wrong { background: rgba(224,112,112,0.18); border-color: #e07070; color: #f0a0a0; }

    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #transcript {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .msg { display: flex; }
    .msg-user { justify-content: flex-end; }
    .msg-assistant { justify-content: flex-start; }

    .bubble {
      max-width: min(680px, 88%);
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .msg-user .bubble {
      background: var(--user-bg);
      border: 1px solid #2a3a50;
      border-bottom-right-radius: 4px;
    }

    .msg-assistant .bubble {
      background: var(--asst-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .audio-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--pill-bg);
      border: 1px solid var(--accent-dim);
      border-radius: 20px;
      padding: 5px 12px 5px 6px;
      margin: 6px 0;
    }

    .play-btn {
      background: var(--accent);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.7rem;
      color: white;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .play-btn:hover { background: #9b8dff; }
    .play-btn:active { transform: scale(0.95); }

    @keyframes pill-spin { to { transform: rotate(360deg); } }
    .audio-pill.playing {
      border-color: var(--accent);
      box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .audio-pill.playing {
      position: relative;
    }
    .audio-pill.playing .play-btn {
      background: transparent;
      border: 2.5px solid var(--accent);
      border-top-color: transparent;
      font-size: 0;
      animation: pill-spin 0.7s linear infinite;
    }
    .audio-pill.playing::before {
      content: '';
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 1px;
      pointer-events: none;
    }

    .pill-label {
      font-size: 0.85rem;
      color: #c0b8f0;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sequence-meta {
      font-size: 0.72rem;
      color: var(--text-dim);
      border-left: 1px solid rgba(124, 106, 247, 0.25);
      padding-left: 8px;
      margin-left: 2px;
      white-space: nowrap;
    }

    .download-btn {
      color: #c0b8f0;
      border: 1px solid rgba(124, 106, 247, 0.3);
      border-radius: 6px;
      padding: 2px 6px;
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0;
      margin-left: auto;
    }
    .download-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .pill-notes {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-left: 6px;
      padding-left: 8px;
      border-left: 1px solid rgba(124, 106, 247, 0.25);
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .pill-notes::-webkit-scrollbar { display: none; }

    .note-chip {
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
      font-size: 0.7rem;
      font-weight: 500;
      color: #a099d0;
      background: rgba(124, 106, 247, 0.08);
      border: 1px solid rgba(124, 106, 247, 0.2);
      border-radius: 5px;
      padding: 2px 5px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.4;
      user-select: none;
      -webkit-user-select: none;
      transition: color 0.12s, background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .note-chip:hover {
      color: #e8e6f0;
      background: rgba(124, 106, 247, 0.22);
      border-color: rgba(124, 106, 247, 0.55);
      box-shadow: 0 0 6px rgba(124, 106, 247, 0.3);
    }
    .note-chip:active { transform: scale(0.92); background: rgba(124, 106, 247, 0.35); }

    @keyframes chip-ping {
      0%   { box-shadow: 0 0 0 0 rgba(124, 106, 247, 0.6); }
      70%  { box-shadow: 0 0 0 5px rgba(124, 106, 247, 0); }
      100% { box-shadow: 0 0 0 0 rgba(124, 106, 247, 0); }
    }
    .note-chip.sounding {
      color: #c8c0ff;
      border-color: var(--accent);
      animation: chip-ping 0.5s ease-out;
    }

    .thinking-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(124, 106, 247, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: pill-spin 0.8s linear infinite;
      vertical-align: middle;
    }

    .staff-btn {
      background: none;
      border: 1px solid rgba(124, 106, 247, 0.3);
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 6px;
      margin-left: auto;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
      line-height: 1.4;
    }
    .staff-btn:hover { border-color: var(--accent); color: var(--text); }
    .staff-btn.open { border-color: var(--accent); color: var(--accent); }

    .staff-panel {
      display: none;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 4px 0 2px 0;
      padding: 8px 12px 4px;
      overflow: hidden;
    }
    .staff-panel.open { display: block; }
    .staff-panel svg { display: block; }
    .sequence-staff-panel {
      overflow-x: auto;
      overflow-y: hidden;
    }
    .pill-wrap {
      display: flex;
      flex-direction: column;
    }

    .message-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .message-images img {
      max-width: min(360px, 100%);
      max-height: 260px;
      border: 1px solid var(--border);
      border-radius: 8px;
      object-fit: contain;
      background: #fff;
    }

    #form-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    #composer {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    #attachment-preview {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
    }
    #attachment-preview.has-images { display: flex; }
    .attachment-thumb {
      position: relative;
      width: 86px;
      height: 64px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .attachment-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .attachment-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 50%;
      color: white;
      background: rgba(0,0,0,0.65);
      cursor: pointer;
      line-height: 20px;
    }

    #message-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
      min-height: 44px;
      max-height: 200px;
    }
    #message-input:focus { border-color: var(--accent); }
    #message-input::placeholder { color: var(--text-dim); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
      transition: background 0.15s, opacity 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #9b8dff; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
    }
    .empty-state .icon { font-size: 3rem; }
    .empty-state p { font-size: 0.9rem; }
    .suggestions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text);
      text-align: left;
      transition: border-color 0.15s;
    }
    .suggestion:hover { border-color: var(--accent); }

    /* Config modal */
    #api-key-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: monospace;
      outline: none;
    }
    #api-key-input:focus { border-color: var(--accent); }
    #api-key-input::placeholder { color: var(--text-dim); font-family: inherit; }

    #config-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 0.85rem;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #config-btn:hover { border-color: var(--accent); color: var(--text); }

    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #config-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 380px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #config-modal h2 { font-size: 1rem; font-weight: 600; }

    .config-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    #port-select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    #port-select:focus { border-color: var(--accent); }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .btn-secondary {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--text); }

    .btn-primary {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #9b8dff; }

    #test-btn {
      background: none;
      border: 1px solid var(--accent-dim);
      border-radius: 8px;
      padding: 7px 14px;
      color: var(--accent);
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #test-btn:hover { background: var(--accent-dim); color: white; }

    #config-status {
      font-size: 0.8rem;
      min-height: 1.2em;
      color: var(--text-dim);
    }
    #config-status.ok { color: #6dbf6d; }
    #config-status.err { color: #e07070; }

    #model-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text-dim);
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      align-self: flex-end;
      height: 44px;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #model-select:focus, #model-select:hover { border-color: var(--accent); color: var(--text); }
    #model-select option { background: var(--surface2); }

    #input-port-select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    #input-port-select:focus { border-color: var(--accent); }

    #record-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #record-bpm {
      width: 60px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 8px;
      color: var(--text);
      font-size: 0.8rem;
      height: 44px;
      outline: none;
      text-align: center;
    }
    #record-bpm:focus { border-color: var(--accent); }

    #record-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      height: 44px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    #record-btn:hover { border-color: #e07070; color: #e07070; }
    #record-btn.recording { border-color: #e07070; background: rgba(224,112,112,0.15); color: #e07070; animation: pulse-rec 1s infinite; }

    @keyframes pulse-rec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #record-status {
      font-size: 0.75rem;
      color: var(--text-dim);
      min-width: 60px;
    }
  </style>
</head>
<body>
  <header>
    <button id="toggle-sidebar" onclick="toggleSidebar()" title="Toggle sessions">☰</button>
    <h1>midi<span>mi</span></h1>
    <div class="tagline">music theory · live playback</div>
    <button id="config-btn" onclick="openConfig()" title="Settings">⚙ Settings</button>
  </header>

  <div id="modal-overlay" onclick="handleOverlayClick(event)">
    <div id="config-modal">
      <h2>Settings</h2>
      <div>
        <div class="config-label">Anthropic API key</div>
        <input id="api-key-input" type="password" placeholder="sk-ant-…" autocomplete="off" />
      </div>
      <div>
        <div class="config-label">Audio output device</div>
        <select id="port-select"></select>
      </div>
      <div>
        <div class="config-label">MIDI input (controller)</div>
        <select id="input-port-select"></select>
      </div>
      <div id="config-status"></div>
      <div class="modal-actions">
        <button id="test-btn" onclick="testOutput()">▶ Test</button>
        <button class="btn-secondary" onclick="closeConfig()">Cancel</button>
        <button class="btn-primary" onclick="applyConfig()">Save</button>
      </div>
    </div>
  </div>

  <div id="layout">
    <div id="sidebar">
      <div id="sidebar-inner">
        <button id="new-chat-btn" onclick="startNewSession()">+ New chat</button>
        <button id="drill-entry" onclick="openDrill()" title="Daily scale-spelling drill">
          <span>🎯 Daily Scale Patch</span>
          <span id="drill-badge">…</span>
        </button>
        <div id="sessions-list">
          <div id="sessions-empty">No sessions yet</div>
        </div>
      </div>
    </div>

    <div id="drill-panel">
      <button id="drill-close" onclick="closeDrill()">← Back to chat</button>
      <div id="drill-grid-wrap">
        <div class="grid-title">Circle of Fifths · mastery</div>
        <div id="drill-grid"></div>
      </div>
      <div id="drill-body" class="drill-card"></div>
    </div>

    <div id="chat-area">
      <div id="transcript">
        <div class="empty-state" id="empty-state">
          <div class="icon">🎹</div>
          <p>Ask about any music theory concept. Claude will explain <em>and</em> play examples.</p>
          <div class="suggestions">
            <button class="suggestion" onclick="suggest(this)">Walk me through the circle of fifths</button>
            <button class="suggestion" onclick="suggest(this)">What makes a dominant 7th chord so tense?</button>
            <button class="suggestion" onclick="suggest(this)">Show me a ii–V–I progression in C major</button>
            <button class="suggestion" onclick="suggest(this)">What's the difference between Dorian and Aeolian?</button>
          </div>
        </div>
      </div>

      <div id="form-area"
        data-signals='{"message": "", "loading": false}'
        data-on-load="initSession()">

        <select id="model-select" title="Model">
          <option value="claude-haiku-4-5-20251001" selected>Haiku</option>
          <option value="claude-sonnet-4-6">Sonnet</option>
          <option value="claude-opus-4-7">Opus</option>
        </select>

        <div id="composer">
          <div id="attachment-preview" aria-live="polite"></div>
          <textarea
            id="message-input"
            placeholder="Ask anything about music theory, or paste a sheet music screenshot…"
            rows="1"
            data-bind-message
            data-on-keydown="handleKey(event)"
          ></textarea>
        </div>

        <button
          id="send-btn"
          data-on-click="sendMessage()"
        >Send</button>

        <div id="record-controls">
          <input id="record-bpm" type="number" min="40" max="300" value="120" title="Tempo (BPM)" />
          <button id="record-btn" onclick="toggleRecord()" title="Record from MIDI controller">&#9679; Rec</button>
          <span id="record-status"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const _SHARP_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
    const _FLAT_NAMES  = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
    const _FLAT_ROOTS  = new Set(['F','Bb','Eb','Ab','Db','Gb','Cb','Fb']);
    function midiNoteName(n, preferFlats) {
      const names = preferFlats ? _FLAT_NAMES : _SHARP_NAMES;
      return names[n % 12] + (Math.floor(n / 12) - 1);
    }

    let sessionId = null;
    let currentStream = null;
    let sidebarOpen = true;
    let pendingImages = [];
    let isLoading = false;

    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
    }

    async function loadSessions() {
      try {
        const r = await fetch('/sessions');
        const sessions = await r.json();
        const list = document.getElementById('sessions-list');

        if (sessions.length === 0) {
          list.innerHTML = '<div id="sessions-empty">No sessions yet</div>';
          return;
        }

        list.innerHTML = '';
        const starred = sessions.filter(s => s.starred);
        const rest = sessions.filter(s => !s.starred);

        function makeSessionEl(s) {
          const el = document.createElement('div');
          el.className = 'session-item' + (s.id === sessionId ? ' active' : '');
          el.dataset.sid = s.id;
          el.title = s.title || 'New session';

          const star = document.createElement('button');
          star.className = 'session-star' + (s.starred ? ' starred' : '');
          star.textContent = '★';
          star.title = s.starred ? 'Unstar' : 'Star';
          star.onclick = async (e) => {
            e.stopPropagation();
            await fetch(`/session/${s.id}/star`, { method: 'POST' });
            loadSessions();
          };

          const label = document.createElement('span');
          label.className = 'session-label';
          label.textContent = s.title || 'New session';
          label.onclick = () => switchSession(s.id);

          const del = document.createElement('button');
          del.className = 'session-delete';
          del.textContent = '✕';
          del.title = 'Delete session';
          del.onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };

          el.appendChild(star);
          el.appendChild(label);
          el.appendChild(del);
          return el;
        }

        if (starred.length > 0) {
          const hdr = document.createElement('div');
          hdr.className = 'sessions-section-header';
          hdr.textContent = 'Starred';
          list.appendChild(hdr);
          starred.forEach(s => list.appendChild(makeSessionEl(s)));
        }

        if (rest.length > 0) {
          if (starred.length > 0) {
            const hdr = document.createElement('div');
            hdr.className = 'sessions-section-header';
            hdr.textContent = 'All';
            list.appendChild(hdr);
          }
          rest.forEach(s => list.appendChild(makeSessionEl(s)));
        }
      } catch (e) {
        console.error('Failed to load sessions', e);
      }
    }

    function markActiveSession() {
      document.querySelectorAll('.session-item').forEach(el => {
        el.classList.toggle('active', el.dataset.sid === sessionId);
      });
    }

    function renderMarkdown(raw) {
      return marked.parse(raw || '', { breaks: true });
    }

    function buildUserBubble(text, mid, images = []) {
      const div = document.createElement('div');
      div.id = mid;
      div.className = 'msg msg-user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (images.length) {
        const imageWrap = document.createElement('div');
        imageWrap.className = 'message-images';
        for (const image of images) {
          const img = document.createElement('img');
          img.src = `data:${image.media_type};base64,${image.data}`;
          img.alt = 'Pasted sheet music';
          imageWrap.appendChild(img);
        }
        bubble.appendChild(imageWrap);
      }
      if (text) bubble.appendChild(document.createTextNode(text));
      div.appendChild(bubble);
      return div;
    }

    function buildAssistantBubble(items, mid) {
      const div = document.createElement('div');
      div.id = mid;
      div.className = 'msg msg-assistant';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      for (const item of items) {
        if (item.type === 'text') {
          const span = document.createElement('span');
          span.innerHTML = renderMarkdown(item.text);
          bubble.appendChild(span);
        } else if (item.type === 'audio') {
          const wrap = document.createElement('div');
          wrap.className = 'pill-wrap';
          const pill = document.createElement('div');
          const pillId = 'p' + Math.random().toString(36).slice(2, 8);
          pill.id = pillId;
          pill.className = 'audio-pill';
          const safeLabel = (item.label || 'Play').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const preferFlats = Boolean(item.prefer_flats) || prefersFlatsFor(item.root || '', item.quality || '');
          let chipsHtml = '';
          if (item.notes && item.notes.length) {
            const chips = item.notes.map(n => {
              const name = midiNoteName(n, preferFlats);
              return `<button class="note-chip" onclick="playMidiNote(${n}, this)" title="${name}">${name}</button>`;
            }).join('');
            chipsHtml = `<div class="pill-notes">${chips}</div>`;
          }
          const staffPanelId = pillId + '-staff';
          const staffNoteNames = item.note_names || (item.notes || []).map(n => midiNoteName(n, preferFlats));
          const hasStaff = staffNoteNames.length > 0;
          const staffBtnHtml = hasStaff
            ? `<button class="staff-btn" data-panel-id="${staffPanelId}" title="Show on staff">\u{1D11E}</button>`
            : '';
          pill.innerHTML = `<button class="play-btn" onclick="replayNote('${item.note_id}')" title="Replay">▶</button><span class="pill-label">♪ ${safeLabel}</span>${chipsHtml}${staffBtnHtml}`;
          if (hasStaff) {
            const staffBtn = pill.querySelector('.staff-btn');
            staffBtn._noteNames = staffNoteNames;
            staffBtn.addEventListener('click', function() { toggleStaff(this.dataset.panelId, this, this._noteNames); });
          }
          const staffPanel = document.createElement('div');
          staffPanel.id = staffPanelId;
          staffPanel.className = 'staff-panel';
          wrap.appendChild(pill);
          wrap.appendChild(staffPanel);
          bubble.appendChild(wrap);
        } else if (item.type === 'sequence') {
          const wrap = document.createElement('div');
          wrap.className = 'pill-wrap';
          const pill = document.createElement('div');
          const pillId = 'p' + Math.random().toString(36).slice(2, 8);
          pill.id = pillId;
          pill.className = 'audio-pill sequence-pill';
          const safeTitle = (item.title || 'Orchestration').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const seconds = Math.max(1, Math.round((item.duration_ms || 1000) / 1000));
          const staffPanelId = pillId + '-staff';
          pill.innerHTML = `<button class="play-btn" onclick="replaySequence('${item.sequence_id}')" title="Replay sequence">▶</button><span class="pill-label">♫ ${safeTitle}</span><span class="sequence-meta">${seconds}s</span><a class="download-btn" href="${item.midi_url}" title="Download MIDI">MIDI</a><button class="staff-btn" data-panel-id="${staffPanelId}" title="Show on staff">\u{1D11E}</button>`;
          const staffBtn = pill.querySelector('.staff-btn');
          staffBtn._abc = item.abc || '';
          staffBtn.addEventListener('click', function() { toggleSequenceStaff(this.dataset.panelId, this, this._abc); });
          const staffPanel = document.createElement('div');
          staffPanel.id = staffPanelId;
          staffPanel.className = 'staff-panel sequence-staff-panel';
          wrap.appendChild(pill);
          wrap.appendChild(staffPanel);
          bubble.appendChild(wrap);
        }
      }
      div.appendChild(bubble);
      return div;
    }

    async function switchSession(sid) {
      if (sid === sessionId) return;
      sessionId = sid;
      markActiveSession();

      const transcript = document.getElementById('transcript');
      transcript.innerHTML = '';

      try {
        const r = await fetch(`/session/${sid}/history`);
        const msgs = await r.json();
        if (msgs.length > 0) {
          for (const msg of msgs) {
            const mid = Math.random().toString(36).slice(2, 10);
            if (msg.role === 'user') {
              transcript.appendChild(buildUserBubble(msg.text, mid, msg.images || []));
            } else if (msg.role === 'assistant') {
              transcript.appendChild(buildAssistantBubble(msg.items, mid));
            }
          }
        } else {
          showEmptyState();
        }
      } catch (e) {
        console.error('Failed to load history', e);
        showEmptyState();
      }
      scrollToBottom();
    }

    function showEmptyState() {
      document.getElementById('transcript').innerHTML = `
        <div class="empty-state" id="empty-state">
          <div class="icon">🎹</div>
          <p>Ask about any music theory concept. Claude will explain <em>and</em> play examples.</p>
          <div class="suggestions">
            <button class="suggestion" onclick="suggest(this)">Walk me through the circle of fifths</button>
            <button class="suggestion" onclick="suggest(this)">What makes a dominant 7th chord so tense?</button>
            <button class="suggestion" onclick="suggest(this)">Show me a ii–V–I progression in C major</button>
            <button class="suggestion" onclick="suggest(this)">What's the difference between Dorian and Aeolian?</button>
          </div>
        </div>`;
    }

    async function deleteSession(sid) {
      await fetch(`/session/${sid}`, { method: 'DELETE' });
      if (sid === sessionId) {
        sessionId = null;
      }
      await loadSessions();
      if (!sessionId) {
        const items = document.querySelectorAll('.session-item');
        if (items.length > 0) {
          await switchSession(items[0].dataset.sid);
        } else {
          const r = await fetch('/session/new');
          const data = await r.json();
          sessionId = data.id;
          await loadSessions();
          markActiveSession();
          showEmptyState();
        }
      }
    }

    async function startNewSession() {
      const r = await fetch('/session/new');
      const data = await r.json();
      sessionId = data.id;
      showEmptyState();
      await loadSessions();
      markActiveSession();
      document.getElementById('message-input').focus();
    }

    async function initSession() {
      // Auto-open settings if API key not configured
      try {
        const r = await fetch('/settings');
        const data = await r.json();
        if (!data.api_key_set) {
          await openConfig();
        }
      } catch (e) { /* ignore */ }

      loadDrillBadge();
      await loadSessions();
      const items = document.querySelectorAll('.session-item');
      if (items.length > 0) {
        await switchSession(items[0].dataset.sid);
      } else {
        const r = await fetch('/session/new');
        const data = await r.json();
        sessionId = data.id;
        await loadSessions();
        markActiveSession();
      }
    }

    function suggest(btn) {
      const input = document.getElementById('message-input');
      input.value = btn.textContent;
      input.dispatchEvent(new Event('input'));
      input.focus();
    }

    function handleKey(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function handleInput(el) {
      autoResize(el);
      updateSendButton();
    }

    function initComposerEvents() {
      const input = document.getElementById('message-input');
      input.addEventListener('input', () => handleInput(input));
      input.addEventListener('paste', handlePaste);
      updateSendButton();
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function updateSendButton() {
      const input = document.getElementById('message-input');
      const send = document.getElementById('send-btn');
      send.disabled = isLoading || (!input.value.trim() && pendingImages.length === 0);
    }

    function renderAttachmentPreview() {
      const preview = document.getElementById('attachment-preview');
      preview.innerHTML = '';
      preview.classList.toggle('has-images', pendingImages.length > 0);
      pendingImages.forEach((image, index) => {
        const thumb = document.createElement('div');
        thumb.className = 'attachment-thumb';

        const img = document.createElement('img');
        img.src = image.url;
        img.alt = 'Pasted sheet music';

        const remove = document.createElement('button');
        remove.className = 'attachment-remove';
        remove.type = 'button';
        remove.textContent = '×';
        remove.title = 'Remove image';
        remove.onclick = () => {
          pendingImages.splice(index, 1);
          renderAttachmentPreview();
          updateSendButton();
        };

        thumb.appendChild(img);
        thumb.appendChild(remove);
        preview.appendChild(thumb);
      });
    }

    function handlePaste(event) {
      const items = Array.from(event.clipboardData?.items || []);
      const imageItems = items.filter(item => item.type.startsWith('image/'));
      if (!imageItems.length) return;

      event.preventDefault();
      for (const item of imageItems.slice(0, 3 - pendingImages.length)) {
        const file = item.getAsFile();
        if (!file) continue;
        if (file.size > 5 * 1024 * 1024) {
          alert('That image is larger than 5 MB.');
          continue;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const url = String(reader.result || '');
          const comma = url.indexOf(',');
          if (comma === -1) return;
          pendingImages.push({
            media_type: file.type || 'image/png',
            data: url.slice(comma + 1),
            url,
          });
          renderAttachmentPreview();
          updateSendButton();
        };
        reader.readAsDataURL(file);
      }
    }

    function replayNote(noteId) {
      const playing = document.querySelector('.audio-pill.playing');
      if (playing) {
        fetch('/stop', { method: 'POST' }).catch(() => {});
        return;
      }
      fetch(`/play/${noteId}`, { method: 'POST' }).catch(() => {});
      startPlayingPoll();
    }

    function replaySequence(sequenceId) {
      const playing = document.querySelector('.audio-pill.playing');
      if (playing) {
        fetch('/stop', { method: 'POST' }).catch(() => {});
        return;
      }
      fetch(`/sequence/${sequenceId}`, { method: 'POST' }).catch(() => {});
      startPlayingPoll();
    }

    window.replayNote = replayNote;
    window.replaySequence = replaySequence;

    function playMidiNote(midiNum, chipEl) {
      fetch(`/play_midi/${midiNum}`, { method: 'POST' }).catch(() => {});
      if (chipEl) {
        chipEl.classList.remove('sounding');
        void chipEl.offsetWidth;
        chipEl.classList.add('sounding');
        chipEl.addEventListener('animationend', () => chipEl.classList.remove('sounding'), { once: true });
      }
    }

    window.playMidiNote = playMidiNote;

    // ── Daily Scale Patch drill ──
    const DRILL_PC = {
      C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,F:5,'E#':5,
      'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11,
    };
    function drillNameToMidi(name) {
      const pc = DRILL_PC[name];
      return pc === undefined ? null : 60 + pc;  // octave 4
    }

    async function loadDrillBadge() {
      try {
        const s = await (await fetch('/drill/status')).json();
        const badge = document.getElementById('drill-badge');
        if (s.due_today > 0) {
          badge.textContent = `${s.due_today} due`;
          badge.classList.remove('done');
        } else {
          badge.textContent = `🔥 ${s.streak_days}`;
          badge.classList.add('done');
        }
      } catch (e) { /* ignore */ }
    }

    // Drill UI state: play-it availability + current answer mode ('type' | 'play').
    let _drillHasInput = false;
    let _drillMode = 'type';
    let _drillRecording = false;

    async function openDrill() {
      document.getElementById('chat-area').style.display = 'none';
      document.getElementById('drill-panel').classList.add('open');
      document.getElementById('drill-entry').classList.add('active');
      try {
        const s = await (await fetch('/settings')).json();
        _drillHasInput = !!s.current_input_port;
      } catch (e) { _drillHasInput = false; }
      if (!_drillHasInput) _drillMode = 'type';
      await loadDrillGrid();
      drillNext();
    }

    function closeDrill() {
      document.getElementById('drill-panel').classList.remove('open');
      document.getElementById('drill-entry').classList.remove('active');
      document.getElementById('chat-area').style.display = 'flex';
      loadDrillBadge();
    }

    // ── Circle-of-fifths mastery grid ──
    const COF = ['C','G','D','A','E','B','F#','Db','Ab','Eb','Bb','F'];  // clockwise from top
    const BOX_COLORS = { 1:'#3a3550', 2:'#4b4a7a', 3:'#5d6fb0', 4:'#6fa8c8', 5:'#7fe0a0' };

    async function loadDrillGrid() {
      let s;
      try { s = await (await fetch('/drill/status')).json(); }
      catch (e) { return; }
      const spell = {}, ear = {};
      (s.keys || []).forEach(k => { (k.direction === 'ear' ? ear : spell)[k.key] = k; });

      const size = 280, cx = size / 2, cy = size / 2, R = 110, r = 22;
      let nodes = '';
      COF.forEach((key, i) => {
        const ang = (i / 12) * 2 * Math.PI - Math.PI / 2;
        const x = cx + R * Math.cos(ang), y = cy + R * Math.sin(ang);
        const row = spell[key];
        const dormant = !row;
        const fill = dormant ? '#262433' : (BOX_COLORS[row.box] || BOX_COLORS[1]);
        const ring = row && row.due ? `<circle cx="${x}" cy="${y}" r="${r + 4}" fill="none" stroke="var(--accent)" stroke-width="2"/>` : '';
        const earMark = ear[key] ? `<text class="cof-ear" x="${x}" y="${y + 15}" text-anchor="middle">ear</text>` : '';
        const title = dormant ? `${key}: locked`
          : `${key}: box ${row.box}${row.last_result ? ' · ' + row.last_result : ''}${row.due ? ' · due now' : ''}`;
        nodes += `<g class="cof-node" opacity="${dormant ? 0.45 : 1}">
            <title>${title}</title>
            ${ring}
            <circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="var(--border)" stroke-width="1"/>
            <text class="cof-label" x="${x}" y="${y + 4}" text-anchor="middle">${key}</text>
            ${earMark}
          </g>`;
      });
      document.getElementById('drill-grid').innerHTML =
        `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${nodes}</svg>`;
    }

    function drillModeToggle() {
      const disabled = _drillHasInput ? '' : 'disabled';
      const hint = _drillHasInput ? '' :
        '<div class="drill-hint">Connect a MIDI keyboard in Settings to play your answer.</div>';
      return `<div class="drill-mode-toggle">
          <button class="${_drillMode === 'type' ? 'active' : ''}" onclick="setDrillMode('type')">⌨ Type</button>
          <button class="${_drillMode === 'play' ? 'active' : ''}" ${disabled} onclick="setDrillMode('play')">🎹 Play it</button>
        </div>${hint}`;
    }

    function setDrillMode(mode) {
      if (mode === 'play' && !_drillHasInput) return;
      _drillMode = mode;
      drillNext();
    }

    async function drillNext() {
      _drillRecording = false;
      const body = document.getElementById('drill-body');
      const r = await (await fetch('/drill/next')).json();
      await loadDrillGrid();
      if (!r.due) {
        body.innerHTML = `<div class="drill-done">
            <div class="big">✅ Patch done</div>
            <div class="drill-sub">🔥 ${r.streak_days} day streak. Come back tomorrow.</div>
            <button class="drill-btn secondary" onclick="closeDrill()">Back to chat</button>
          </div>`;
        return;
      }
      body.dataset.key = r.key;
      body.dataset.direction = r.direction;

      if (r.direction === 'ear') {
        const choices = (r.choices || []).map(k =>
          `<button class="drill-choice" data-key="${k}" onclick="submitEar('${k}')">${k}</button>`).join('');
        body.innerHTML = `
          <div class="drill-prompt">🔊 Name the key</div>
          <div class="drill-sub">${r.due_today} due today · listen, then choose</div>
          <div><button class="drill-btn secondary" onclick="drillPlayPrompt()">▶ Play scale</button></div>
          <div class="drill-choices">${choices}</div>
          <div class="drill-result" id="drill-result"></div>`;
        drillPlayPrompt();
        return;
      }

      // Spelling direction — type or play-it.
      body.innerHTML = `
        ${drillModeToggle()}
        <div class="drill-prompt">${r.prompt}</div>
        <div class="drill-sub">${r.due_today} due today · ▶ hear after answering</div>
        <div id="drill-input-area"></div>
        <div class="drill-result" id="drill-result"></div>`;
      renderDrillInput();
    }

    function renderDrillInput() {
      const area = document.getElementById('drill-input-area');
      if (_drillMode === 'play') {
        area.innerHTML = `
          <div class="drill-hint">Play the scale slowly, one hand. Octaves are fine — we grade the notes.</div>
          <div><button class="drill-btn" id="drill-rec-btn" onclick="toggleDrillRecord()">● Start playing</button></div>`;
      } else {
        area.innerHTML = `
          <input id="drill-answer" placeholder="e.g. D E F# G A B C#" autocomplete="off" />

    async function toggleDrillRecord() {
      const btn = document.getElementById('drill-rec-btn');

    function renderPlayedResult(key, r) {
      const notesHtml = r.played_names.map(n => {
        const ok = !r.wrong_notes.includes(n);
        return `<span class="drill-note ${ok ? 'ok' : 'bad'}">${n}</span>`;
      }).join('') || '<span class="drill-note bad">— nothing played —</span>';
      const verdict = r.correct
        ? '<div class="drill-verdict correct">✓ Correct</div>'
        : '<div class="drill-verdict incorrect">✗ Not quite</div>';
      const missing = r.missing_notes.length
        ? `<div class="drill-sub">Missing: ${r.missing_notes.join(' ')}</div>` : '';
      document.getElementById('drill-result').innerHTML = `
        ${verdict}
        <div class="drill-notes">${notesHtml}</div>
        ${missing}
        <div class="drill-sub">${key} major: ${r.expected.join(' ')}</div>
        <div>
          <button class="drill-btn secondary" onclick="drillHear()">▶ Hear it</button>
          <button class="drill-btn" onclick="drillNext()">Next</button>
        </div>`;
      document.getElementById('drill-body').dataset.expected = r.expected.join(',');
      loadDrillBadge();
      loadDrillGrid();
      if (r.correct) drillHear();

    async function submitDrill() {
      const body = document.getElementById('drill-body');
      const key = body.dataset.key;
      const input = document.getElementById('drill-answer');
      if (!input) return;
      const answer = input.value.trim().split(/[\s,]+/).filter(Boolean);
      if (!answer.length) return;
      const r = await (await fetch('/drill/grade', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, answer, direction: 'spell' }),
      })).json();

      const notesHtml = r.per_note.map(p => {
        const label = p.expected || p.got || '—';
        return `<span class="drill-note ${p.ok ? 'ok' : 'bad'}">${label}</span>`;
      }).join('');
      const verdict = r.correct
        ? '<div class="drill-verdict correct">✓ Correct</div>'
        : '<div class="drill-verdict incorrect">✗ Not quite</div>';
      document.getElementById('drill-result').innerHTML = `
        ${verdict}
        <div class="drill-notes">${notesHtml}</div>
        <div class="drill-sub">${key} major: ${r.expected.join(' ')}</div>
        <div>
          <button class="drill-btn secondary" onclick="drillHear()">▶ Hear it</button>
          <button class="drill-btn" onclick="drillNext()">Next</button>
        </div>`;
      body.dataset.expected = r.expected.join(',');
      loadDrillBadge();
      loadDrillGrid();
      if (r.correct) drillHear();
    }

    function drillPlayPrompt() {
      const key = document.getElementById('drill-body').dataset.key;
      fetch('/drill/play_prompt', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },

    async function submitEar(chosen) {
      const body = document.getElementById('drill-body');
      const key = body.dataset.key;
      if (body.dataset.answered) return;
      body.dataset.answered = '1';
      const r = await (await fetch('/drill/grade', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, direction: 'ear', choice: chosen }),
      })).json();
      document.querySelectorAll('.drill-choice').forEach(btn => {
        const k = btn.dataset.key;
        if (k === key) btn.classList.add('right');
        else if (k === chosen) btn.classList.add('wrong');
        btn.disabled = true;
      });
      const verdict = r.correct
        ? '<div class="drill-verdict correct">✓ Correct</div>'
        : `<div class="drill-verdict incorrect">✗ It was ${key}</div>`;
      body.dataset.expected = r.expected.join(',');
      document.getElementById('drill-result').innerHTML = `
        ${verdict}
        <div class="drill-sub">${key} major: ${r.expected.join(' ')}</div>
        <div>
          <button class="drill-btn secondary" onclick="drillHear()">▶ Compare</button>
          <button class="drill-btn" onclick="drillNext()">Next</button>
        </div>`;
      delete body.dataset.answered;
      loadDrillBadge();
      loadDrillGrid();
    }

    function drillHear() {
      const expected = (document.getElementById('drill-body').dataset.expected || '').split(',').filter(Boolean);
      // Ascend monotonically: bump the octave whenever the pitch class wraps,
      // so e.g. Bb major sounds Bb-C-D-... ascending instead of jumping octaves.
      let prev = -1, step = 0;
      expected.forEach((name) => {
        let midi = drillNameToMidi(name);
        if (midi === null) return;
        while (midi <= prev) midi += 12;
        prev = midi;
        const m = midi;
        setTimeout(() => playMidiNote(m), step++ * 350);
      });
    }

    let _playingPollTimer = null;

    function startPlayingPoll() {
      if (_playingPollTimer) return;
      _playingPollTimer = setInterval(async () => {
        const pills = document.querySelectorAll('.audio-pill');
        if (!pills.length) {
          stopPlayingPoll();
          return;
        }
        try {
          const res = await fetch('/playing');
          const active = await res.json();
          const activeSet = new Set(active);
          pills.forEach(pill => {
            const btn = pill.querySelector('.play-btn');
            if (!btn) return;
            const onclick = btn.getAttribute('onclick') || '';
            const activeId =
              onclick.match(/replayNote\('([^']+)'\)/)?.[1] ||
              onclick.match(/replaySequence\('([^']+)'\)/)?.[1];
            if (!activeId) return;
            pill.classList.toggle('playing', activeSet.has(activeId));
          });
        } catch {}
      }, 150);
    }

    function stopPlayingPoll() {
      clearInterval(_playingPollTimer);
      _playingPollTimer = null;
    }

    function scrollToBottom() {
      const t = document.getElementById('transcript');
      t.scrollTop = t.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const message = input.value.trim();
      const images = pendingImages.map(({ media_type, data }) => ({ media_type, data }));
      if ((!message && images.length === 0) || !sessionId) return;

      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      input.value = '';
      input.style.height = 'auto';
      input.dispatchEvent(new Event('input'));
      pendingImages = [];
      renderAttachmentPreview();

      isLoading = true;
      updateSendButton();

      if (currentStream) currentStream.abort();
      const controller = new AbortController();
      currentStream = controller;

      try {
        const response = await fetch('/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message, images, model: document.getElementById('model-select').value }),
          signal: controller.signal,
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const parts = buffer.split('\n\n');
          buffer = parts.pop();

          for (const part of parts) {
            processSSE(part);
          }
          scrollToBottom();
        }
      } catch (e) {
        if (e.name !== 'AbortError') console.error(e);
      } finally {
        isLoading = false;
        updateSendButton();
        currentStream = null;
        // Refresh sidebar to reflect updated title/order (title may still be generating)
        setTimeout(() => loadSessions().then(markActiveSession), 1500);
      }
    }

    function processSSE(raw) {
      const lines = raw.split('\n');
      let event = '';
      const dataLines = [];

      for (const line of lines) {
        if (line.startsWith('event: ')) event = line.slice(7).trim();
        else if (line.startsWith('data: ')) dataLines.push(line.slice(6));
      }

      if (event === 'datastar-merge-fragments') {
        let selector = '';
        let mergeMode = 'append';
        const fragmentLines = [];

        for (const d of dataLines) {
          if (d.startsWith('selector ')) selector = d.slice(9);
          else if (d.startsWith('mergeMode ')) mergeMode = d.slice(10);
          else if (d.startsWith('fragments ')) fragmentLines.push(d.slice(10));
        }

        const fragment = fragmentLines.join('\n');
        applyMerge(selector, mergeMode, fragment);
        if (fragment.includes('audio-pill')) startPlayingPoll();

      } else if (event === 'datastar-merge-signals') {
        for (const d of dataLines) {
          if (d.startsWith('signals ')) {
            try {
              const signals = JSON.parse(d.slice(8));
              if ('loading' in signals) {
                isLoading = signals.loading;
                updateSendButton();
                if (!isLoading) {
                  document.querySelectorAll('.thinking-spinner').forEach(s => s.remove());
                }
              }
              if ('textUpdate' in signals) {
                const { segId, raw } = signals.textUpdate;
                const el = document.getElementById(segId);
                if (el) {
                  const spinner = el.parentElement?.querySelector('.thinking-spinner');
                  if (spinner) spinner.remove();
                  el.innerHTML = renderMarkdown(raw);
                }
              }
            } catch {}
          }
        }
      }
    }

    function prefersFlatsFor(root, quality = '') {
      const normalizedQuality = String(quality || '').toLowerCase().replace(/♭/g, 'b');
      return _FLAT_ROOTS.has(root || '') || normalizedQuality.includes('b9') || normalizedQuality.includes('flat9');
    }

    function toggleStaff(panelId, btn, noteNames) {
      const panel = document.getElementById(panelId);
      if (!panel) return;
      const isOpen = panel.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
      if (isOpen && !panel.dataset.rendered) {
        renderStaff(panel, noteNames);
        panel.dataset.rendered = '1';
      }
    }

    window.toggleStaff = toggleStaff;

    function toggleSequenceStaff(panelId, btn, abc) {
      const panel = document.getElementById(panelId);
      if (!panel) return;
      const isOpen = panel.classList.toggle('open');
      btn.classList.toggle('open', isOpen);

    window.toggleSequenceStaff = toggleSequenceStaff;

    function noteNameToAbc(noteName) {
      // server-spelled e.g. "Bb4", "F#3", "C5" → ABC token (^F, _B c etc.)
      const m = noteName.match(/^([A-G])([#b]{0,2})?(-?\d+)$/);
      if (!m) return 'C';
      const letter = m[1];
      const acc = (m[2] || '').replace(/#/g, '^').replace(/b/g, '_');
      const octave = parseInt(m[3], 10);
      let abcLetter, marks;
      if (octave >= 5) { abcLetter = letter.toLowerCase(); marks = "'".repeat(octave - 5); }
      else { abcLetter = letter; marks = ','.repeat(4 - octave); }
      return `${acc}${abcLetter}${marks}`;
    }

    function renderStaff(panel, noteNames) {
      if (typeof ABCJS === 'undefined') { panel.textContent = 'abcjs not loaded'; return; }
      if (!noteNames || !noteNames.length) { panel.textContent = 'No notation to render'; return; }
      panel.innerHTML = '';
      const tokens = noteNames.map(noteNameToAbc);
      const body = tokens.length === 1 ? tokens[0] : `[${tokens.join('')}]`;
      const abc = `X:1\nM:4/4\nL:1/1\nK:C\n${body}`;
      ABCJS.renderAbc(panel, abc, {
        responsive: 'resize',
        staffwidth: Math.min(panel.parentElement.offsetWidth - 24, 420),
        scale: 1.3,
        foregroundColor: '#c0b8f0',
        paddingtop: 6,
        paddingbottom: 6,
        paddingleft: 4,
        paddingright: 4,
      });
    }

    function renderSequenceStaff(panel, abc) {
      if (typeof ABCJS === 'undefined') { panel.textContent = 'abcjs not loaded'; return; }
      if (!abc || !abc.trim()) { panel.textContent = 'No notation to render'; return; }
      panel.innerHTML = '';
      const width = Math.max(panel.parentElement.offsetWidth - 24, 320);
      ABCJS.renderAbc(panel, abc, {
        responsive: 'resize',
        staffwidth: width,
        scale: 1.1,
        foregroundColor: '#c0b8f0',
        paddingtop: 6,
        paddingbottom: 6,
        paddingleft: 4,
        paddingright: 4,
      });
    }

    function applyMerge(selector, mode, html) {
      const target = selector ? document.querySelector(selector) : document.body;
      if (!target) return;

      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const newEl = tmp.firstElementChild;
      if (!newEl) return;

      if (mode === 'append') {
        target.appendChild(newEl);
      } else if (mode === 'prepend') {
        target.prepend(newEl);
      } else if (mode === 'morph') {
        const existing = document.getElementById(newEl.id);
        if (existing) {
          existing.innerHTML = newEl.innerHTML;
        } else {
          target.appendChild(newEl);
        }
      } else if (mode === 'replace') {
        const existing = document.getElementById(newEl.id);
        if (existing) existing.replaceWith(newEl);
        else target.appendChild(newEl);
      }
    }

      try {
        const r = await fetch('/record/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessionId,
            tempo_bpm: _recordBpm,
            time_signature: _recordTimeSignature,
            title: 'Recording',
          }),
        });
        const data = await r.json();
        document.getElementById('record-status').textContent = '';
        if (r.ok && data.ok) {
          // Inject pill into transcript
          const transcript = document.getElementById('transcript');
          const wrap = document.createElement('div');
          wrap.className = 'msg msg-assistant';
          wrap.innerHTML = `<div class="bubble">${data.pill_html}</div>`;
          transcript.appendChild(wrap);
          transcript.scrollTop = transcript.scrollHeight;
          document.getElementById('empty-state')?.remove();
        } else {
          alert(data.detail || 'Recording could not be quantized. No notes captured?');
        }
      } catch (e) {
        console.error(e);
        document.getElementById('record-status').textContent = '';
        alert('Recording failed.');
      }
    }
  </script>
</body>
</html>
