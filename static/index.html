<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>midimi — music theory tutor</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@starfederation/datastar@1.0.0-beta.11/dist/datastar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #14141c;
      --border: #2a2a38;
      --accent: #7c6af7;
      --accent-dim: #4a3fa3;
      --text: #e8e6f0;
      --text-dim: #888;
      --user-bg: #1e2a3a;
      --asst-bg: #1a1a22;
      --pill-bg: #252535;
      --sidebar-w: 240px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.05em; }
    header span { color: var(--accent); }
    .tagline { color: var(--text-dim); font-size: 0.8rem; margin-left: auto; }

    #toggle-sidebar {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 0.85rem;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #toggle-sidebar:hover { border-color: var(--accent); color: var(--text); }

    #layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #sidebar {
      width: var(--sidebar-w);
      background: var(--surface2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s ease, opacity 0.2s ease;
      overflow: hidden;
    }
    #sidebar.collapsed {
      width: 0;
      opacity: 0;
      border-right: none;
    }

    #sidebar-inner {
      width: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    #new-chat-btn {
      margin: 12px;
      padding: 8px 12px;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    #new-chat-btn:hover { background: #9b8dff; }

    #sessions-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .session-item {
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.12s, color 0.12s;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .session-item:hover { background: var(--surface); color: var(--text); }
    .session-item.active {
      background: var(--surface);
      color: var(--text);
      border-color: var(--accent-dim);
    }
    .session-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-delete {
      flex-shrink: 0;
      background: none;
      border: none;
      color: transparent;
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0 2px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.12s, background 0.12s;
    }
    .session-item:hover .session-delete { color: var(--text-dim); }
    .session-delete:hover { color: #e07070 !important; background: rgba(224,112,112,0.12); }
    .session-star {
      flex-shrink: 0;
      background: none;
      border: none;
      color: transparent;
      cursor: pointer;
      font-size: 0.78rem;
      padding: 0 2px;
      line-height: 1;
      border-radius: 4px;
      transition: color 0.12s, background 0.12s;
    }
    .session-item:hover .session-star { color: var(--text-dim); }
    .session-star.starred { color: #f0c040 !important; }
    .session-star:hover { color: #f0c040 !important; background: rgba(240,192,64,0.12); }
    .sessions-section-header {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 10px 10px 4px;
      opacity: 0.6;
    }

    #sessions-empty {
      color: var(--text-dim);
      font-size: 0.8rem;
      text-align: center;
      padding: 20px 12px;
    }

    #chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #transcript {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .msg { display: flex; }
    .msg-user { justify-content: flex-end; }
    .msg-assistant { justify-content: flex-start; }

    .bubble {
      max-width: min(680px, 88%);
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .msg-user .bubble {
      background: var(--user-bg);
      border: 1px solid #2a3a50;
      border-bottom-right-radius: 4px;
    }

    .msg-assistant .bubble {
      background: var(--asst-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .audio-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--pill-bg);
      border: 1px solid var(--accent-dim);
      border-radius: 20px;
      padding: 5px 12px 5px 6px;
      margin: 6px 0;
    }

    .play-btn {
      background: var(--accent);
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.7rem;
      color: white;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .play-btn:hover { background: #9b8dff; }
    .play-btn:active { transform: scale(0.95); }

    @keyframes pill-spin { to { transform: rotate(360deg); } }
    .audio-pill.playing {
      border-color: var(--accent);
      box-shadow: 0 0 6px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    .audio-pill.playing {
      position: relative;
    }
    .audio-pill.playing .play-btn {
      background: transparent;
      border: 2.5px solid var(--accent);
      border-top-color: transparent;
      font-size: 0;
      animation: pill-spin 0.7s linear infinite;
    }
    .audio-pill.playing::before {
      content: '';
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 1px;
      pointer-events: none;
    }

    .pill-label {
      font-size: 0.85rem;
      color: #c0b8f0;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .sequence-meta {
      font-size: 0.72rem;
      color: var(--text-dim);
      border-left: 1px solid rgba(124, 106, 247, 0.25);
      padding-left: 8px;
      margin-left: 2px;
      white-space: nowrap;
    }

    .download-btn {
      color: #c0b8f0;
      border: 1px solid rgba(124, 106, 247, 0.3);
      border-radius: 6px;
      padding: 2px 6px;
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0;
      margin-left: auto;
    }
    .download-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .pill-notes {
      display: flex;
      align-items: center;
      gap: 3px;
      margin-left: 6px;
      padding-left: 8px;
      border-left: 1px solid rgba(124, 106, 247, 0.25);
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .pill-notes::-webkit-scrollbar { display: none; }

    .note-chip {
      font-family: "SF Mono", "Fira Code", ui-monospace, monospace;
      font-size: 0.7rem;
      font-weight: 500;
      color: #a099d0;
      background: rgba(124, 106, 247, 0.08);
      border: 1px solid rgba(124, 106, 247, 0.2);
      border-radius: 5px;
      padding: 2px 5px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.4;
      user-select: none;
      -webkit-user-select: none;
      transition: color 0.12s, background 0.12s, border-color 0.12s, box-shadow 0.12s;
    }
    .note-chip:hover {
      color: #e8e6f0;
      background: rgba(124, 106, 247, 0.22);
      border-color: rgba(124, 106, 247, 0.55);
      box-shadow: 0 0 6px rgba(124, 106, 247, 0.3);
    }
    .note-chip:active { transform: scale(0.92); background: rgba(124, 106, 247, 0.35); }

    @keyframes chip-ping {
      0%   { box-shadow: 0 0 0 0 rgba(124, 106, 247, 0.6); }
      70%  { box-shadow: 0 0 0 5px rgba(124, 106, 247, 0); }
      100% { box-shadow: 0 0 0 0 rgba(124, 106, 247, 0); }
    }
    .note-chip.sounding {
      color: #c8c0ff;
      border-color: var(--accent);
      animation: chip-ping 0.5s ease-out;
    }

    .thinking-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(124, 106, 247, 0.25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: pill-spin 0.8s linear infinite;
      vertical-align: middle;
    }

    .staff-btn {
      background: none;
      border: 1px solid rgba(124, 106, 247, 0.3);
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 2px 6px;
      margin-left: auto;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s;
      line-height: 1.4;
    }
    .staff-btn:hover { border-color: var(--accent); color: var(--text); }
    .staff-btn.open { border-color: var(--accent); color: var(--accent); }

    .staff-panel {
      display: none;
      background: #111118;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin: 4px 0 2px 0;
      padding: 8px 12px 4px;
      overflow: hidden;
    }
    .staff-panel.open { display: block; }
    .staff-panel svg { display: block; }
    .sequence-staff-panel {
      overflow-x: auto;
      overflow-y: hidden;
    }
    .pill-wrap {
      display: flex;
      flex-direction: column;
    }

    .message-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .message-images img {
      max-width: min(360px, 100%);
      max-height: 260px;
      border: 1px solid var(--border);
      border-radius: 8px;
      object-fit: contain;
      background: #fff;
    }

    #form-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    #composer {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 0;
    }

    #attachment-preview {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
    }
    #attachment-preview.has-images { display: flex; }
    .attachment-thumb {
      position: relative;
      width: 86px;
      height: 64px;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .attachment-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .attachment-remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 50%;
      color: white;
      background: rgba(0,0,0,0.65);
      cursor: pointer;
      line-height: 20px;
    }

    #message-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
      min-height: 44px;
      max-height: 200px;
    }
    #message-input:focus { border-color: var(--accent); }
    #message-input::placeholder { color: var(--text-dim); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      color: white;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-end;
      transition: background 0.15s, opacity 0.15s;
    }
    #send-btn:hover:not(:disabled) { background: #9b8dff; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-dim);
    }
    .empty-state .icon { font-size: 3rem; }
    .empty-state p { font-size: 0.9rem; }
    .suggestions { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .suggestion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--text);
      text-align: left;
      transition: border-color 0.15s;
    }
    .suggestion:hover { border-color: var(--accent); }

    /* Config modal */
    #api-key-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: monospace;
      outline: none;
    }
    #api-key-input:focus { border-color: var(--accent); }
    #api-key-input::placeholder { color: var(--text-dim); font-family: inherit; }

    #config-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 0.85rem;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #config-btn:hover { border-color: var(--accent); color: var(--text); }

    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #config-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      width: 380px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #config-modal h2 { font-size: 1rem; font-weight: 600; }

    .config-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    #port-select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    #port-select:focus { border-color: var(--accent); }

    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    .btn-secondary {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 14px;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-secondary:hover { border-color: var(--accent); color: var(--text); }

    .btn-primary {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      color: white;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #9b8dff; }

    #test-btn {
      background: none;
      border: 1px solid var(--accent-dim);
      border-radius: 8px;
      padding: 7px 14px;
      color: var(--accent);
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    #test-btn:hover { background: var(--accent-dim); color: white; }

    #config-status {
      font-size: 0.8rem;
      min-height: 1.2em;
      color: var(--text-dim);
    }
    #config-status.ok { color: #6dbf6d; }
    #config-status.err { color: #e07070; }

    #model-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 10px;
      color: var(--text-dim);
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      align-self: flex-end;
      height: 44px;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #model-select:focus, #model-select:hover { border-color: var(--accent); color: var(--text); }
    #model-select option { background: var(--surface2); }

    #input-port-select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }
    #input-port-select:focus { border-color: var(--accent); }

    #record-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    #record-bpm {
      width: 60px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 8px;
      color: var(--text);
      font-size: 0.8rem;
      height: 44px;
      outline: none;
      text-align: center;
    }
    #record-bpm:focus { border-color: var(--accent); }

    #record-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--text-dim);
      font-size: 0.85rem;
      cursor: pointer;
      height: 44px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    #record-btn:hover { border-color: #e07070; color: #e07070; }
    #record-btn.recording { border-color: #e07070; background: rgba(224,112,112,0.15); color: #e07070; animation: pulse-rec 1s infinite; }

    @keyframes pulse-rec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #record-status {
      font-size: 0.75rem;
      color: var(--text-dim);
      min-width: 60px;
    }
  </style>
</head>
<body>
  <header>
    <button id="toggle-sidebar" onclick="toggleSidebar()" title="Toggle sessions">☰</button>
    <h1>midi<span>mi</span></h1>
    <div class="tagline">music theory · live playback</div>
    <button id="config-btn" onclick="openConfig()" title="Settings">⚙ Settings</button>
  </header>

  <div id="modal-overlay" onclick="handleOverlayClick(event)">
    <div id="config-modal">
      <h2>Settings</h2>
      <div>
        <div class="config-label">Anthropic API key</div>
        <input id="api-key-input" type="password" placeholder="sk-ant-…" autocomplete="off" />
      </div>
      <div>
        <div class="config-label">Audio output device</div>
        <select id="port-select"></select>
      </div>
      <div>
        <div class="config-label">MIDI input (controller)</div>
        <select id="input-port-select"></select>
      </div>
      <div id="config-status"></div>
      <div class="modal-actions">
        <button id="test-btn" onclick="testOutput()">▶ Test</button>
        <button class="btn-secondary" onclick="closeConfig()">Cancel</button>
        <button class="btn-primary" onclick="applyConfig()">Save</button>
      </div>
    </div>
  </div>

  <div id="layout">
    <div id="sidebar">
      <div id="sidebar-inner">
        <button id="new-chat-btn" onclick="startNewSession()">+ New chat</button>
        <div id="sessions-list">
          <div id="sessions-empty">No sessions yet</div>
        </div>
      </div>
    </div>

    <div id="chat-area">
      <div id="transcript">
        <div class="empty-state" id="empty-state">
          <div class="icon">🎹</div>
          <p>Ask about any music theory concept. Claude will explain <em>and</em> play examples.</p>
          <div class="suggestions">
            <button class="suggestion" onclick="suggest(this)">Walk me through the circle of fifths</button>
            <button class="suggestion" onclick="suggest(this)">What makes a dominant 7th chord so tense?</button>
            <button class="suggestion" onclick="suggest(this)">Show me a ii–V–I progression in C major</button>
            <button class="suggestion" onclick="suggest(this)">What's the difference between Dorian and Aeolian?</button>
          </div>
        </div>
      </div>

      <div id="form-area"
        data-signals='{"message": "", "loading": false}'
        data-on-load="initSession()">

        <select id="model-select" title="Model">
          <option value="claude-haiku-4-5-20251001" selected>Haiku</option>
          <option value="claude-sonnet-4-6">Sonnet</option>
          <option value="claude-opus-4-7">Opus</option>
        </select>

        <div id="composer">
          <div id="attachment-preview" aria-live="polite"></div>
          <textarea
            id="message-input"
            placeholder="Ask anything about music theory, or paste a sheet music screenshot…"
            rows="1"
            data-bind-message
            data-on-keydown="handleKey(event)"
          ></textarea>
        </div>

        <button
          id="send-btn"
          data-on-click="sendMessage()"
        >Send</button>

        <div id="record-controls">
          <input id="record-bpm" type="number" min="40" max="300" value="120" title="Tempo (BPM)" />
          <button id="record-btn" onclick="toggleRecord()" title="Record from MIDI controller">&#9679; Rec</button>
          <span id="record-status"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const _SHARP_NAMES = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
    const _FLAT_NAMES  = ['C','D♭','D','E♭','E','F','G♭','G','A♭','A','B♭','B'];
    const _FLAT_ROOTS  = new Set(['F','Bb','Eb','Ab','Db','Gb','Cb','Fb']);
    function midiNoteName(n, preferFlats) {
      const names = preferFlats ? _FLAT_NAMES : _SHARP_NAMES;
      return names[n % 12] + (Math.floor(n / 12) - 1);
    }

    let sessionId = null;
    let currentStream = null;
    let sidebarOpen = true;
    let pendingImages = [];
    let isLoading = false;

    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
    }

    async function loadSessions() {
      try {
        const r = await fetch('/sessions');
        const sessions = await r.json();
        const list = document.getElementById('sessions-list');

        if (sessions.length === 0) {
          list.innerHTML = '<div id="sessions-empty">No sessions yet</div>';
          return;
        }

        list.innerHTML = '';
        const starred = sessions.filter(s => s.starred);
        const rest = sessions.filter(s => !s.starred);

        function makeSessionEl(s) {
          const el = document.createElement('div');
          el.className = 'session-item' + (s.id === sessionId ? ' active' : '');
          el.dataset.sid = s.id;
          el.title = s.title || 'New session';

          const star = document.createElement('button');
          star.className = 'session-star' + (s.starred ? ' starred' : '');
          star.textContent = '★';
          star.title = s.starred ? 'Unstar' : 'Star';
          star.onclick = async (e) => {
            e.stopPropagation();
            await fetch(`/session/${s.id}/star`, { method: 'POST' });
            loadSessions();
          };

          const label = document.createElement('span');
          label.className = 'session-label';
          label.textContent = s.title || 'New session';
          label.onclick = () => switchSession(s.id);

          const del = document.createElement('button');
          del.className = 'session-delete';
          del.textContent = '✕';
          del.title = 'Delete session';
          del.onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };

          el.appendChild(star);
          el.appendChild(label);
          el.appendChild(del);
          return el;
        }

        if (starred.length > 0) {
          const hdr = document.createElement('div');
          hdr.className = 'sessions-section-header';
          hdr.textContent = 'Starred';
          list.appendChild(hdr);
          starred.forEach(s => list.appendChild(makeSessionEl(s)));
        }

        if (rest.length > 0) {
          if (starred.length > 0) {
            const hdr = document.createElement('div');
            hdr.className = 'sessions-section-header';
            hdr.textContent = 'All';
            list.appendChild(hdr);
          }
          rest.forEach(s => list.appendChild(makeSessionEl(s)));
        }
      } catch (e) {
        console.error('Failed to load sessions', e);
      }
    }

    function markActiveSession() {
      document.querySelectorAll('.session-item').forEach(el => {
        el.classList.toggle('active', el.dataset.sid === sessionId);
      });
    }

    function renderMarkdown(raw) {
      return marked.parse(raw || '', { breaks: true });
    }

    function buildUserBubble(text, mid, images = []) {
      const div = document.createElement('div');
      div.id = mid;
      div.className = 'msg msg-user';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      if (images.length) {
        const imageWrap = document.createElement('div');
        imageWrap.className = 'message-images';
        for (const image of images) {
          const img = document.createElement('img');
          img.src = `data:${image.media_type};base64,${image.data}`;
          img.alt = 'Pasted sheet music';
          imageWrap.appendChild(img);
        }
        bubble.appendChild(imageWrap);
      }
      if (text) bubble.appendChild(document.createTextNode(text));
      div.appendChild(bubble);
      return div;
    }

    function buildAssistantBubble(items, mid) {
      const div = document.createElement('div');
      div.id = mid;
      div.className = 'msg msg-assistant';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      for (const item of items) {
        if (item.type === 'text') {
          const span = document.createElement('span');
          span.innerHTML = renderMarkdown(item.text);
          bubble.appendChild(span);
        } else if (item.type === 'audio') {
          const wrap = document.createElement('div');
          wrap.className = 'pill-wrap';
          const pill = document.createElement('div');
          const pillId = 'p' + Math.random().toString(36).slice(2, 8);
          pill.id = pillId;
          pill.className = 'audio-pill';
          const safeLabel = (item.label || 'Play').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const preferFlats = Boolean(item.prefer_flats) || prefersFlatsFor(item.root || '', item.quality || '');
          let chipsHtml = '';
          if (item.notes && item.notes.length) {
            const chips = item.notes.map(n => {
              const name = midiNoteName(n, preferFlats);
              return `<button class="note-chip" onclick="playMidiNote(${n}, this)" title="${name}">${name}</button>`;
            }).join('');
            chipsHtml = `<div class="pill-notes">${chips}</div>`;
          }
          const staffPanelId = pillId + '-staff';
          const staffNoteNames = item.note_names || (item.notes || []).map(n => midiNoteName(n, preferFlats));
          const hasStaff = staffNoteNames.length > 0;
          const staffBtnHtml = hasStaff
            ? `<button class="staff-btn" data-panel-id="${staffPanelId}" title="Show on staff">\u{1D11E}</button>`
            : '';
          pill.innerHTML = `<button class="play-btn" onclick="replayNote('${item.note_id}')" title="Replay">▶</button><span class="pill-label">♪ ${safeLabel}</span>${chipsHtml}${staffBtnHtml}`;
          if (hasStaff) {
            const staffBtn = pill.querySelector('.staff-btn');
            staffBtn._noteNames = staffNoteNames;
            staffBtn.addEventListener('click', function() { toggleStaff(this.dataset.panelId, this, this._noteNames); });
          }
          const staffPanel = document.createElement('div');
          staffPanel.id = staffPanelId;
          staffPanel.className = 'staff-panel';
          wrap.appendChild(pill);
          wrap.appendChild(staffPanel);
          bubble.appendChild(wrap);
        } else if (item.type === 'sequence') {
          const wrap = document.createElement('div');
          wrap.className = 'pill-wrap';
          const pill = document.createElement('div');
          const pillId = 'p' + Math.random().toString(36).slice(2, 8);
          pill.id = pillId;
          pill.className = 'audio-pill sequence-pill';
          const safeTitle = (item.title || 'Orchestration').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const seconds = Math.max(1, Math.round((item.duration_ms || 1000) / 1000));
          const staffPanelId = pillId + '-staff';
          pill.innerHTML = `<button class="play-btn" onclick="replaySequence('${item.sequence_id}')" title="Replay sequence">▶</button><span class="pill-label">♫ ${safeTitle}</span><span class="sequence-meta">${seconds}s</span><a class="download-btn" href="${item.midi_url}" title="Download MIDI">MIDI</a><button class="staff-btn" data-panel-id="${staffPanelId}" title="Show on staff">\u{1D11E}</button>`;
          const staffBtn = pill.querySelector('.staff-btn');
          staffBtn._eventsData = item.events || [];
          staffBtn.addEventListener('click', function() { toggleSequenceStaff(this.dataset.panelId, this, this._eventsData); });
          const staffPanel = document.createElement('div');
          staffPanel.id = staffPanelId;
          staffPanel.className = 'staff-panel sequence-staff-panel';
          wrap.appendChild(pill);
          wrap.appendChild(staffPanel);
          bubble.appendChild(wrap);
        }
      }
      div.appendChild(bubble);
      return div;
    }

    async function switchSession(sid) {
      if (sid === sessionId) return;
      sessionId = sid;
      markActiveSession();

      const transcript = document.getElementById('transcript');
      transcript.innerHTML = '';

      try {
        const r = await fetch(`/session/${sid}/history`);
        const msgs = await r.json();
        if (msgs.length > 0) {
          for (const msg of msgs) {
            const mid = Math.random().toString(36).slice(2, 10);
            if (msg.role === 'user') {
              transcript.appendChild(buildUserBubble(msg.text, mid, msg.images || []));
            } else if (msg.role === 'assistant') {
              transcript.appendChild(buildAssistantBubble(msg.items, mid));
            }
          }
        } else {
          showEmptyState();
        }
      } catch (e) {
        console.error('Failed to load history', e);
        showEmptyState();
      }
      scrollToBottom();
    }

    function showEmptyState() {
      document.getElementById('transcript').innerHTML = `
        <div class="empty-state" id="empty-state">
          <div class="icon">🎹</div>
          <p>Ask about any music theory concept. Claude will explain <em>and</em> play examples.</p>
          <div class="suggestions">
            <button class="suggestion" onclick="suggest(this)">Walk me through the circle of fifths</button>
            <button class="suggestion" onclick="suggest(this)">What makes a dominant 7th chord so tense?</button>
            <button class="suggestion" onclick="suggest(this)">Show me a ii–V–I progression in C major</button>
            <button class="suggestion" onclick="suggest(this)">What's the difference between Dorian and Aeolian?</button>
          </div>
        </div>`;
    }

    async function deleteSession(sid) {
      await fetch(`/session/${sid}`, { method: 'DELETE' });
      if (sid === sessionId) {
        sessionId = null;
      }
      await loadSessions();
      if (!sessionId) {
        const items = document.querySelectorAll('.session-item');
        if (items.length > 0) {
          await switchSession(items[0].dataset.sid);
        } else {
          const r = await fetch('/session/new');
          const data = await r.json();
          sessionId = data.id;
          await loadSessions();
          markActiveSession();
          showEmptyState();
        }
      }
    }

    async function startNewSession() {
      const r = await fetch('/session/new');
      const data = await r.json();
      sessionId = data.id;
      showEmptyState();
      await loadSessions();
      markActiveSession();
      document.getElementById('message-input').focus();
    }

    async function initSession() {
      // Auto-open settings if API key not configured
      try {
        const r = await fetch('/settings');
        const data = await r.json();
        if (!data.api_key_set) {
          await openConfig();
        }
      } catch (e) { /* ignore */ }

      await loadSessions();
      const items = document.querySelectorAll('.session-item');
      if (items.length > 0) {
        await switchSession(items[0].dataset.sid);
      } else {
        const r = await fetch('/session/new');
        const data = await r.json();
        sessionId = data.id;
        await loadSessions();
        markActiveSession();
      }
    }

    function suggest(btn) {
      const input = document.getElementById('message-input');
      input.value = btn.textContent;
      input.dispatchEvent(new Event('input'));
      input.focus();
    }

    function handleKey(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function handleInput(el) {
      autoResize(el);
      updateSendButton();
    }

    function initComposerEvents() {
      const input = document.getElementById('message-input');
      input.addEventListener('input', () => handleInput(input));
      input.addEventListener('paste', handlePaste);
      updateSendButton();
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 200) + 'px';
    }

    function updateSendButton() {
      const input = document.getElementById('message-input');
      const send = document.getElementById('send-btn');
      send.disabled = isLoading || (!input.value.trim() && pendingImages.length === 0);
    }

    function renderAttachmentPreview() {
      const preview = document.getElementById('attachment-preview');
      preview.innerHTML = '';
      preview.classList.toggle('has-images', pendingImages.length > 0);
      pendingImages.forEach((image, index) => {
        const thumb = document.createElement('div');
        thumb.className = 'attachment-thumb';

        const img = document.createElement('img');
        img.src = image.url;
        img.alt = 'Pasted sheet music';

        const remove = document.createElement('button');
        remove.className = 'attachment-remove';
        remove.type = 'button';
        remove.textContent = '×';
        remove.title = 'Remove image';
        remove.onclick = () => {
          pendingImages.splice(index, 1);
          renderAttachmentPreview();
          updateSendButton();
        };

        thumb.appendChild(img);
        thumb.appendChild(remove);
        preview.appendChild(thumb);
      });
    }

    function handlePaste(event) {
      const items = Array.from(event.clipboardData?.items || []);
      const imageItems = items.filter(item => item.type.startsWith('image/'));
      if (!imageItems.length) return;

      event.preventDefault();
      for (const item of imageItems.slice(0, 3 - pendingImages.length)) {
        const file = item.getAsFile();
        if (!file) continue;
        if (file.size > 5 * 1024 * 1024) {
          alert('That image is larger than 5 MB.');
          continue;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const url = String(reader.result || '');
          const comma = url.indexOf(',');
          if (comma === -1) return;
          pendingImages.push({
            media_type: file.type || 'image/png',
            data: url.slice(comma + 1),
            url,
          });
          renderAttachmentPreview();
          updateSendButton();
        };
        reader.readAsDataURL(file);
      }
    }

    function replayNote(noteId) {
      const playing = document.querySelector('.audio-pill.playing');
      if (playing) {
        fetch('/stop', { method: 'POST' }).catch(() => {});
        return;
      }
      fetch(`/play/${noteId}`, { method: 'POST' }).catch(() => {});
      startPlayingPoll();
    }

    function replaySequence(sequenceId) {
      const playing = document.querySelector('.audio-pill.playing');
      if (playing) {
        fetch('/stop', { method: 'POST' }).catch(() => {});
        return;
      }
      fetch(`/sequence/${sequenceId}`, { method: 'POST' }).catch(() => {});
      startPlayingPoll();
    }

    window.replayNote = replayNote;
    window.replaySequence = replaySequence;

    function playMidiNote(midiNum, chipEl) {
      fetch(`/play_midi/${midiNum}`, { method: 'POST' }).catch(() => {});
      if (chipEl) {
        chipEl.classList.remove('sounding');
        void chipEl.offsetWidth;
        chipEl.classList.add('sounding');
        chipEl.addEventListener('animationend', () => chipEl.classList.remove('sounding'), { once: true });
      }
    }

    window.playMidiNote = playMidiNote;

    let _playingPollTimer = null;

    function startPlayingPoll() {
      if (_playingPollTimer) return;
      _playingPollTimer = setInterval(async () => {
        const pills = document.querySelectorAll('.audio-pill');
        if (!pills.length) {
          stopPlayingPoll();
          return;
        }
        try {
          const res = await fetch('/playing');
          const active = await res.json();
          const activeSet = new Set(active);
          pills.forEach(pill => {
            const btn = pill.querySelector('.play-btn');
            if (!btn) return;
            const onclick = btn.getAttribute('onclick') || '';
            const activeId =
              onclick.match(/replayNote\('([^']+)'\)/)?.[1] ||
              onclick.match(/replaySequence\('([^']+)'\)/)?.[1];
            if (!activeId) return;
            pill.classList.toggle('playing', activeSet.has(activeId));
          });
        } catch {}
      }, 150);
    }

    function stopPlayingPoll() {
      clearInterval(_playingPollTimer);
      _playingPollTimer = null;
    }

    function scrollToBottom() {
      const t = document.getElementById('transcript');
      t.scrollTop = t.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('message-input');
      const message = input.value.trim();
      const images = pendingImages.map(({ media_type, data }) => ({ media_type, data }));
      if ((!message && images.length === 0) || !sessionId) return;

      const empty = document.getElementById('empty-state');
      if (empty) empty.remove();

      input.value = '';
      input.style.height = 'auto';
      input.dispatchEvent(new Event('input'));
      pendingImages = [];
      renderAttachmentPreview();

      isLoading = true;
      updateSendButton();

      if (currentStream) currentStream.abort();
      const controller = new AbortController();
      currentStream = controller;

      try {
        const response = await fetch('/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, message, images, model: document.getElementById('model-select').value }),
          signal: controller.signal,
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const parts = buffer.split('\n\n');
          buffer = parts.pop();

          for (const part of parts) {
            processSSE(part);
          }
          scrollToBottom();
        }
      } catch (e) {
        if (e.name !== 'AbortError') console.error(e);
      } finally {
        isLoading = false;
        updateSendButton();
        currentStream = null;
        // Refresh sidebar to reflect updated title/order (title may still be generating)
        setTimeout(() => loadSessions().then(markActiveSession), 1500);
      }
    }

    function processSSE(raw) {
      const lines = raw.split('\n');
      let event = '';
      const dataLines = [];

      for (const line of lines) {
        if (line.startsWith('event: ')) event = line.slice(7).trim();
        else if (line.startsWith('data: ')) dataLines.push(line.slice(6));
      }

      if (event === 'datastar-merge-fragments') {
        let selector = '';
        let mergeMode = 'append';
        const fragmentLines = [];

        for (const d of dataLines) {
          if (d.startsWith('selector ')) selector = d.slice(9);
          else if (d.startsWith('mergeMode ')) mergeMode = d.slice(10);
          else if (d.startsWith('fragments ')) fragmentLines.push(d.slice(10));
        }

        const fragment = fragmentLines.join('\n');
        applyMerge(selector, mergeMode, fragment);
        if (fragment.includes('audio-pill')) startPlayingPoll();

      } else if (event === 'datastar-merge-signals') {
        for (const d of dataLines) {
          if (d.startsWith('signals ')) {
            try {
              const signals = JSON.parse(d.slice(8));
              if ('loading' in signals) {
                isLoading = signals.loading;
                updateSendButton();
                if (!isLoading) {
                  document.querySelectorAll('.thinking-spinner').forEach(s => s.remove());
                }
              }
              if ('textUpdate' in signals) {
                const { segId, raw } = signals.textUpdate;
                const el = document.getElementById(segId);
                if (el) {
                  const spinner = el.parentElement?.querySelector('.thinking-spinner');
                  if (spinner) spinner.remove();
                  el.innerHTML = renderMarkdown(raw);
                }
              }
            } catch {}
          }
        }
      }
    }

    // ── Config modal ────────────────────────────────────────────────────────

    async function openConfig() {
      const status = document.getElementById('config-status');
      status.textContent = '';
      status.className = '';
      document.getElementById('api-key-input').value = '';

      try {
        const r = await fetch('/settings');
        const data = await r.json();

        if (data.api_key_set) {
          document.getElementById('api-key-input').placeholder = '(key saved — enter new value to change)';
        } else {
          document.getElementById('api-key-input').placeholder = 'sk-ant-…';
        }

        const sel = document.getElementById('port-select');
        sel.innerHTML = '<option value="">FluidSynth (built-in)</option>';
        for (const p of data.ports) {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          if (p === data.current_port) opt.selected = true;
          sel.appendChild(opt);
        }
        if (!data.current_port) sel.value = '';

        const isel = document.getElementById('input-port-select');
        isel.innerHTML = '<option value="">None (monitoring off)</option>';
        for (const p of (data.input_ports || [])) {
          const opt = document.createElement('option');
          opt.value = p;
          opt.textContent = p;
          if (p === data.current_input_port) opt.selected = true;
          isel.appendChild(opt);
        }
        if (!data.current_input_port) isel.value = '';
      } catch (e) {
        console.error(e);
      }

      document.getElementById('modal-overlay').classList.add('open');
    }

    function closeConfig() {
      document.getElementById('modal-overlay').classList.remove('open');
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('modal-overlay')) closeConfig();
    }

    async function applyConfig() {
      const sel = document.getElementById('port-select');
      const port = sel.value || null;
      const isel = document.getElementById('input-port-select');
      const inputPort = isel.value;  // "" means disable
      const apiKey = document.getElementById('api-key-input').value.trim();
      const status = document.getElementById('config-status');
      status.textContent = 'Saving…';
      status.className = '';

      const body = { port, input_port: inputPort };
      if (apiKey) body.api_key = apiKey;

      try {
        const r = await fetch('/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await r.json();
        if (data.ok) {
          status.textContent = 'Settings saved.';
          status.className = 'ok';
          setTimeout(closeConfig, 800);
        }
      } catch (e) {
        status.textContent = 'Failed to save';
        status.className = 'err';
      }
    }

    async function testOutput() {
      const sel = document.getElementById('port-select');
      const port = sel.value || null;
      const status = document.getElementById('config-status');
      status.textContent = 'Sending test note…';
      status.className = '';
      try {
        const r = await fetch('/config/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ port }),
        });
        const data = await r.json();
        if (data.ok) {
          status.textContent = 'Test note sent — did you hear it?';
          status.className = 'ok';
        }
      } catch (e) {
        status.textContent = 'Request failed';
        status.className = 'err';
      }
    }

    // ── Staff rendering ─────────────────────────────────────────────────────────

    function prefersFlatsFor(root, quality = '') {
      const normalizedQuality = String(quality || '').toLowerCase().replace(/♭/g, 'b');
      return _FLAT_ROOTS.has(root || '') || normalizedQuality.includes('b9') || normalizedQuality.includes('flat9');
    }

    function toggleStaff(panelId, btn, noteNames) {
      const panel = document.getElementById(panelId);
      if (!panel) return;
      const isOpen = panel.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
      if (isOpen && !panel.dataset.rendered) {
        renderStaff(panel, noteNames);
        panel.dataset.rendered = '1';
      }
    }

    window.toggleStaff = toggleStaff;

    function toggleSequenceStaff(panelId, btn, events) {
      const panel = document.getElementById(panelId);
      if (!panel) return;
      const isOpen = panel.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
      if (isOpen && !panel.dataset.rendered) {
        renderSequenceStaff(panel, events || []);
        panel.dataset.rendered = '1';
      }
    }

    window.toggleSequenceStaff = toggleSequenceStaff;

    function noteNameToVexKey(noteName) {
      // noteName is server-spelled e.g. "Bb4", "F#3", "C5"
      const m = noteName.match(/^([A-Ga-g][#b]?)(-?\d+)$/);
      if (!m) return `c/4`;
      return `${m[1].toLowerCase()}/${m[2]}`;
    }

    function addAccidentals(staveNote, keys, Accidental) {
      keys.forEach((k, i) => {
        const pc = k.split('/')[0];
        if (pc.includes('#')) staveNote.addModifier(new Accidental('#'), i);
        else if (pc.endsWith('b') && pc !== 'b') staveNote.addModifier(new Accidental('b'), i);
      });
    }

    function durationBeatsToVex(beats) {
      if (beats >= 3.5) return 'w';
      if (beats >= 1.75) return 'h';
      if (beats >= 0.75) return 'q';
      if (beats >= 0.375) return '8';
      return '16';
    }

    function renderStaff(panel, noteNames) {
      const VF = (typeof Vex !== 'undefined' ? Vex : typeof VexFlow !== 'undefined' ? VexFlow : null);
      if (!VF) { panel.textContent = 'VexFlow not loaded'; return; }
      const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = VF.Flow || VF;

      const width = Math.min(panel.parentElement.offsetWidth - 24, 420);
      const scale = 1.6;
      const height = Math.round(120 * scale);
      const renderer = new Renderer(panel, Renderer.Backends.SVG);
      renderer.resize(width, height);
      const ctx = renderer.getContext();
      ctx.setFillStyle('#c0b8f0');
      ctx.setStrokeStyle('#7c6af7');
      ctx.scale(scale, scale);

      const stave = new Stave(10, 5, (width / scale) - 20);
      stave.addClef('treble');
      stave.setContext(ctx).draw();

      const keys = noteNames.map(noteNameToVexKey);
      const staveNote = new StaveNote({ clef: 'treble', keys, duration: 'w' });
      addAccidentals(staveNote, keys, Accidental);

      const voice = new Voice({ num_beats: 4, beat_value: 4 }).setStrict(false);
      voice.addTickables([staveNote]);
      new Formatter().joinVoices([voice]).format([voice], (width / 1.6) - 80);
      voice.draw(ctx, stave);
    }

    function renderSequenceStaff(panel, events) {
      const VF = (typeof Vex !== 'undefined' ? Vex : typeof VexFlow !== 'undefined' ? VexFlow : null);
      if (!VF) { panel.textContent = 'VexFlow not loaded'; return; }
      const { Renderer, Stave, StaveNote, Voice, Formatter, Accidental } = VF.Flow || VF;
      const cleanEvents = (events || []).filter(event => (event.note_names || event.notes) && (event.note_names || event.notes).length);
      if (!cleanEvents.length) { panel.textContent = 'No notes to render'; return; }

      panel.innerHTML = '';
      const width = Math.max(panel.parentElement.offsetWidth - 24, 180 + cleanEvents.length * 92);
      const scale = 1.25;
      const height = Math.round(130 * scale);
      const renderer = new Renderer(panel, Renderer.Backends.SVG);
      renderer.resize(width, height);
      const ctx = renderer.getContext();
      ctx.setFillStyle('#c0b8f0');
      ctx.setStrokeStyle('#7c6af7');
      ctx.scale(scale, scale);

      const staveWidth = (width / scale) - 20;
      const stave = new Stave(10, 8, staveWidth);
      stave.addClef('treble');
      stave.setContext(ctx).draw();

      const tickables = cleanEvents.map(event => {
        const names = event.note_names || (() => {
          const preferFlats = prefersFlatsFor(event.root || '', event.quality || '');
          const sharpNames = ['c','c#','d','d#','e','f','f#','g','g#','a','a#','b'];
          const flatNames  = ['c','db','d','eb','e','f','gb','g','ab','a','bb','b'];
          return event.notes.map(m => `${(preferFlats ? flatNames : sharpNames)[m % 12]}${Math.floor(m / 12) - 1}`);
        })();
        const keys = names.map(noteNameToVexKey);
        const staveNote = new StaveNote({
          clef: 'treble',
          keys,
          duration: durationBeatsToVex(Number(event.duration_beats || 1)),
        });
        addAccidentals(staveNote, keys, Accidental);
        return staveNote;
      });

      const totalBeats = cleanEvents.reduce((sum, event) => sum + Number(event.duration_beats || 1), 0);
      const voice = new Voice({ num_beats: Math.max(1, Math.ceil(totalBeats)), beat_value: 4 }).setStrict(false);
      voice.addTickables(tickables);
      new Formatter().joinVoices([voice]).format([voice], staveWidth - 70);
      voice.draw(ctx, stave);
    }

    function applyMerge(selector, mode, html) {
      const target = selector ? document.querySelector(selector) : document.body;
      if (!target) return;

      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      const newEl = tmp.firstElementChild;
      if (!newEl) return;

      if (mode === 'append') {
        target.appendChild(newEl);
      } else if (mode === 'prepend') {
        target.prepend(newEl);
      } else if (mode === 'morph') {
        const existing = document.getElementById(newEl.id);
        if (existing) {
          existing.innerHTML = newEl.innerHTML;
        } else {
          target.appendChild(newEl);
        }
      } else if (mode === 'replace') {
        const existing = document.getElementById(newEl.id);
        if (existing) existing.replaceWith(newEl);
        else target.appendChild(newEl);
      }
    }

    initComposerEvents();

    // ── Recording ────────────────────────────────────────────────────────────

    let _recording = false;
    let _recordBpm = 120;
    let _recordTimeSignature = '4/4';

    async function toggleRecord() {
      if (_recording) {
        await stopRecord();
      } else {
        await startRecord();
      }
    }

    async function startRecord() {
      if (!sessionId) { alert('Start a chat session first.'); return; }
      _recordBpm = parseInt(document.getElementById('record-bpm').value, 10) || 120;
      try {
        const r = await fetch('/record/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: sessionId, tempo_bpm: _recordBpm, time_signature: _recordTimeSignature }),
        });
        const data = await r.json();
        if (r.ok && data.ok) {
          _recording = true;
          const btn = document.getElementById('record-btn');
          btn.classList.add('recording');
          btn.textContent = '⏹ Stop';
          document.getElementById('record-status').textContent = 'Recording…';
        } else {
          alert(data.detail || 'Could not start recording. Is a MIDI input port selected in Settings?');
        }
      } catch (e) {
        console.error(e);
        alert('Recording failed to start.');
      }
    }

    async function stopRecord() {
      _recording = false;
      const btn = document.getElementById('record-btn');
      btn.classList.remove('recording');
      btn.innerHTML = '&#9679; Rec';
      document.getElementById('record-status').textContent = 'Processing…';

      _recordBpm = parseInt(document.getElementById('record-bpm').value, 10) || 120;
      try {
        const r = await fetch('/record/stop', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessionId,
            tempo_bpm: _recordBpm,
            time_signature: _recordTimeSignature,
            title: 'Recording',
          }),
        });
        const data = await r.json();
        document.getElementById('record-status').textContent = '';
        if (r.ok && data.ok) {
          // Inject pill into transcript
          const transcript = document.getElementById('transcript');
          const wrap = document.createElement('div');
          wrap.className = 'msg msg-assistant';
          wrap.innerHTML = `<div class="bubble">${data.pill_html}</div>`;
          transcript.appendChild(wrap);
          transcript.scrollTop = transcript.scrollHeight;
          document.getElementById('empty-state')?.remove();
        } else {
          alert(data.detail || 'Recording could not be quantized. No notes captured?');
        }
      } catch (e) {
        console.error(e);
        document.getElementById('record-status').textContent = '';
        alert('Recording failed.');
      }
    }
  </script>
